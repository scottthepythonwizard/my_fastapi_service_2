<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLE · My favorites</title><link rel="stylesheet" href="/account.css"><script src="/account-config.js" defer></script><script src="/account.js" defer></script></head>
<body><header><a href="/archive">SOLE. ARCHIVE</a><nav aria-label="SOLE sites"><a href="/fit/">Fit</a><a href="/compare/">Compare</a><button id="signout" hidden>Sign out</button></nav></header>
<main><h1>Your pairs. Your favorites.</h1><p id="identity"></p><p id="status" role="status" aria-live="polite"></p>
<section id="auth"><h2>Sign in</h2><form id="signin"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button type="submit">Sign in</button><button id="signup" type="button">Create account</button></form><p>New accounts may require email confirmation before sign-in.</p></section>
<div id="member" hidden><section><h2>My favorites (<span id="favorite-count">0</span>)</h2><button id="refresh" type="button">Refresh favorites</button><div id="favorites" class="grid"></div></section><section><h2>Find a favorite</h2><label>Search sneakers<input id="search" type="search" placeholder="Brand or sneaker name"></label><div id="catalog" class="grid"></div></section></div>
<section id="admin" hidden><h2>Manage sneakers</h2><p>Update a sneaker’s name or price, or delete a sneaker. Deleting removes it from everyone’s favorites.</p><div id="admin-list"></div></section></main></body></html>
